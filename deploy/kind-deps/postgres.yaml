apiVersion: apps/v1
kind: Deployment
metadata:
  name: banking-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: banking-postgres
  template:
    metadata:
      labels:
        app: banking-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17.6-bookworm
          env:
            - name: POSTGRES_DB
              value: banking
            - name: POSTGRES_USER
              value: banking
            - name: POSTGRES_HOST_AUTH_METHOD
              value: trust
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, banking, -d, banking]
            initialDelaySeconds: 3
            periodSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: banking-postgres
spec:
  type: ClusterIP
  selector:
    app: banking-postgres
  ports:
    - port: 5432
      targetPort: 5432
